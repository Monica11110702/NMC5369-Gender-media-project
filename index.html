const MH_POS={mohini:{label:'Mohini Pei',positions:[['caste','Caste positioning and recognition','If Mohini occupied a different caste position, access to allies, whose testimony officials accepted, and expectations about marriage might change. Economic resources could complicate those relationships rather than cancel them.'],['wealth','Economic independence','With independent income, she might afford transport or legal assistance, while still facing reputational pressure and the king’s political authority.'],['sexuality','Sexuality and acceptable relationships','If her desires or relationships differed from community expectations, the meaning of the king’s promise and the support available to her might change. The outcome cannot be inferred from sexuality alone.'],['gender','Gender recognition','In a speculative contemporary retelling, a trans woman or non-binary protagonist might encounter different forms of recognition and exclusion. Modern identity terms should not be projected uncritically onto an unspecified historical setting.']]},red:{label:'The Red Bride',positions:[['wealth','Economic position','If the Li household were wealthy, the girl would not have this tragedy. However, misfortune would befall other poor households with daughters. Who knows?'],['education','Educational background','If she had received even a little education, she would have soon recognized the hopeless future awaiting her and would have been far more likely to choose suicide.']]}};
const mhShell=x=>`<div class="mh"><div class="shell"><header class="top"><div class="logo">MONST(H)ER</div>${state.screen==='intro'?'':`<button class="nav" onclick="go('intro')">Return home</button>`}</header>${x}<footer class="footer"><strong>MONST(H)ER</strong> · An educational, fictional interactive media prototype.<p>Primary theoretical source: Phoenix, A. (2006). “Interrogating intersectionality: Productive ways of theorising multiple positioning.” <em>Kvinder, Køn & Forskning</em>, 2–3, 21–30. Second theoretical source: Lykke, N. (2010). “Theorizing intersectionalities: Genealogies and blind spots.” In <em>Feminist Studies: A Guide to Intersectional Theory, Methodology and Writing</em> (Chapter 5). Routledge. Folklore-inspired fiction is distinct from Phoenix's analysis. The Red Bride narrative is adapted from the group's supplied <em>The Red Bridal Dress: Complete Storyline V2</em>; Mohini Pei is an original feminist fictional retelling inspired by recurring folklore motifs.</p></footer></div></div>`;
const mhPages={intro:()=>`<section id="home" class="hero"><div><div class="eyebrow">An interactive folklore project · Intersectionality</div><h1>MONST(H)ER</h1><p class="lede">From an intersectional perspective, this game aims to help players understand, through a first-person perspective, the hopelessness of women's choices regarding marriage freedom when facing the combined constraints of class, family relations, and cultural norms.</p><button class="button" onclick="go('select')">Discover the project →</button></div></section><section id="rationale" class="section"><div class="eyebrow">Why this project exists</div><h2>One identity never tells the whole story.</h2><div class="intro-grid"><div><p>Why does one person's refusal carry different consequences from another's? Why can someone have influence in one relationship and little power in another?</p><p>MONST(H)ER uses a short choice-based game to explore how gender, class, sexuality, caste or community position may shape the opportunities available to a person. The choices matter — but they never happen in a vacuum.</p><p>After each story, the <em>What If?</em> experience lets you revisit its turning points through two questions drawn from the reading.</p></div><div class="readings"><div class="paper"><div class="eyebrow">Our central reading</div><h3>Ann Phoenix (2006)</h3><p><em>Interrogating Intersectionality: Productive Ways of Theorising Multiple Positioning</em></p><p class="small">Phoenix argues that social categories cannot be understood separately. She examines three debates: how structure relates to agency; which intersections matter in a particular context; and how intersectionality can be analysed without reducing people to fixed categories.</p><p class="source">Phoenix, 2006, pp. 22–28 (journal pagination). The game is our creative application of the reading, not an empirical study.</p></div><div class="paper"><div class="eyebrow">Our second reading</div><h3>Nina Lykke (2010)</h3><p><em>Feminist Studies: A Guide to Intersectional Theory, Methodology and Writing</em></p><p>Chapter 5 — Theorizing Intersectionalities: Genealogies and Blind Spots</p><p class="small">Lykke explores how intersecting power relations shape individuals' experiences while highlighting the tension between agency and structural constraints. She also discusses the blind spots of intersectional analysis, encouraging us to ask what forms of inequality may be overlooked.</p><p class="source">Lykke, 2010, Chapter 5, pp. 73–75, 82–83. The game creatively applies these ideas to reinterpret female ghost folklore.</p></div></div></div></section>`,select:()=>`<section id="characters" class="section"><div class="eyebrow">Character archive / 02 stories</div><h2>Whose story will you enter?</h2><p class="lede">Choose one character. Each story has five decisions and a separate reflection. No identity questionnaire is required before playing.</p><div class="cards"><article class="char"><img src="${MH_IMG.mohini}" alt="Illustrated portrait of Mohini Pei in an ivory sari with jasmine"><div class="content"><div class="eyebrow">Tamil-inspired · Fictional retelling</div><h3>Mohini Pei</h3><p>A promise of love, a powerful man, and a village that decides whose voice deserves to be believed.</p><button class="button" onclick="pick('mohini')">Begin Mohini's story →</button></div></article><article class="char"><img src="${MH_IMG.red}" alt="Illustrated portrait of a Chinese bride in a red veil"><div class="content"><div class="eyebrow">Chinese-inspired · Fictional retelling</div><h3>The Red Bride</h3><p>A family in debt, a wedding to a deceased heir, and a future negotiated without the bride's consent.</p><button class="button" onclick="pick('red')">Begin the bride's story →</button></div></article></div><p class="story-note">Cultural note: caste is explored only in Mohini's Tamil-inspired context. The Chinese story examines family hierarchy, class and community standing instead. Both stories use invented characters and scenes.</p></section>`,whatif:()=>`<section id="whatif" class="section"><div class="what"><div class="eyebrow">After the ending · A different lens</div><h2>What if her circumstances had been different?</h2><p>You cannot replay every possible life. Instead, explore two questions inspired by Phoenix's debates. These are <strong>possible</strong> alternative outcomes in our fictional worlds — not predictions about real people.</p><div class="debate"><div class="eyebrow">Debate 01 / Structure & agency</div><h3>What if she could get different support?</h3><p class="small">Agency matters, but resources and social structures influence what a decision can accomplish.</p><select id="what-support" onchange="renderWhatIf()"><option value="money">Independent financial resources</option><option value="ally">An ally with institutional influence</option></select><div class="result" id="support-result"></div><div class="source">Phoenix, pp. 23–25: the debate over structural positioning and individual agency.</div></div><div class="debate"><div class="eyebrow">Debate 02 / Which intersections matter?</div><h3>What if one social position changed?</h3><p class="small">Relevant intersections are historically and culturally situated; they are not interchangeable.</p><select id="what-position" onchange="renderWhatIf()"></select><div class="result" id="position-result"></div><div class="source">Phoenix, pp. 25–26: researchers must make contextual decisions about which intersections to examine.</div></div>${state.who==='mohini'?'<p class="story-note">These speculative stories use contemporary analytical language to examine fictional worlds. They do not imply that modern labels for sexuality or gender identity were used in the same way in the historical periods evoked by the artwork.</p>':''}<button class="button" onclick="go('reflect')">Continue to reflection →</button></div></section>`,reflect:()=>`<section id="final" class="finale"><div class="eyebrow">MONST(H)ER · Intersecting lives</div><h2>Her identity did not determine her fate. But it shaped the possibilities she was given.</h2><p class="lede" style="margin:0 auto 12px">A single legend can never hold every version of a life.</p><p class="small">More stories. More lives. More intersections. The MONST(H)ER archive is only beginning.</p><div class="debate"><div class="eyebrow">Debate 03 / How do we study identity?</div><h3>What does a different lens reveal?</h3><p class="small">Phoenix discusses Leslie McCall's approaches to analysing intersectionality.</p><select id="what-method" onchange="renderMethod()"><option value="intra">Intra-categorical — look closely at one life</option><option value="inter">Inter-categorical — compare social positions</option><option value="anti">Anti-categorical — question the labels</option></select><div class="result" id="method-result"></div><div class="source">Phoenix, pp. 26–27: discussion of McCall's anti-, intra- and inter-categorical approaches. Our interactive prompts illustrate these ideas; they are not empirical methods.</div></div><div class="foot-actions"><button class="button" onclick="go('select')">Explore the other story</button><button class="button secondary" onclick="go('intro')">Return home</button></div></section>`};
function renderWhatIf(){const who=state.who==='mohini'?'mohini':'red',d=MH_POS[who],w=state.wi||{};const sel=document.getElementById('what-position');if(sel.dataset.active!==who){sel.innerHTML='';d.positions.forEach(([key,label])=>{const opt=document.createElement('option');opt.value=key;opt.textContent=label;sel.appendChild(opt)});sel.dataset.active=who;const su=document.getElementById('what-support');if(w.position)sel.value=w.position;if(w.support)su.value=w.support;if(!sel.value)sel.selectedIndex=0;if(!su.value)su.selectedIndex=0}const sup=document.getElementById('what-support').value;const subject=who==='mohini'?'Mohini':'the bride';const supports={money:`Independent resources could let ${subject} travel or refuse economic dependence. Social stigma and powerful families might still constrain her.`,ally:`An influential ally might open doors previously closed to ${subject}, but this could also make her dependent on another person's goodwill.`};document.getElementById('support-result').textContent=supports[sup];const pos=d.positions.find(x=>x[0]===sel.value)||d.positions[0];document.getElementById('position-result').textContent=pos[2];state.wi={...w,support:sup,position:sel.value};rbSave()}
function renderMethod(){const who=state.who==='mohini'?'mohini':'red',d=MH_POS[who],w=state.wi||{},subject=who==='mohini'?'Mohini':'the bride',sel=document.getElementById('what-method');if(!sel.dataset.ready){sel.dataset.ready=1;if(w.method)sel.value=w.method}const method=sel.value;const methods={intra:`Look beyond “${d.label}” as a category: consider the small hopes, contradictory relationships and individual choices you witnessed. Her experience cannot stand in for every person in her cultural setting.`,inter:`Compare how ${who==='mohini'?'money, community ties and recognition':'money and education'} might alter access to help in this same fictional situation. Comparing positions is useful, but does not establish a universal hierarchy of oppression.`,anti:`Question the label “monster” itself. Who gave ${subject} that name? What did the label conceal? Categories can organise social life, but they are not neutral descriptions of a whole person.`};document.getElementById('method-result').textContent=methods[method];state.wi={...w,method};rbSave()}
// Keep the player's place across page refreshes (per tab).
const RB_SAVE='monsther-state';
function rbSave(){try{sessionStorage.setItem(RB_SAVE,JSON.stringify(state))}catch(e){}}
try{const saved=JSON.parse(sessionStorage.getItem(RB_SAVE));if(saved&&saved.screen){state=saved;if(state.screen==='archive')state.screen='whatif'}}catch(e){}
{const draw=render;render=function(){draw();rbSave()}}
render();
</script></body></html>
