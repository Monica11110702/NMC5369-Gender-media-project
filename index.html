const cite=(page,idea)=>`<details class="theory"><summary>Why this choice matters · Sex in Public (p. ${page})</summary><p>${idea}</p><small>Berlant, L. & Warner, M. (1998). <i>Sex in Public</i>, Critical Inquiry, 24(2), 547–566. This is a creative application of the reading, not a claim that the authors analysed this folklore.</small></details>`;
const theory={
 economy:cite('553','Berlant and Warner explain that conventional intimacy is connected to social reproduction and the accumulation and transfer of capital. The grain exchanged for the Red Bride’s marriage makes that economic dimension visible.'),
 norm:cite('548, 554','The authors define heteronormativity as social arrangements that make heterosexuality privileged, including its presentation as an ideal or moral accomplishment. The game examines how a community can treat marriage as obligatory and naturally right.'),
 public:cite('553','Berlant and Warner argue that intimacy is publicly mediated. What seems like a private relationship is shaped by families, institutions, reputation and material arrangements.'),
 ordinary:cite('554, 557','The authors describe how norms acquire a taken-for-granted sense of rightness. Here, even sympathetic characters repeat the expectations they have inherited.'),
 institution:cite('562','Berlant and Warner describe the institutional and material supports of normative intimacy, including marriage and family law. This fictional ghost-marriage ritual is an analogy, not a claim about modern Chinese marriage law.'),
 will:cite('566','The authors caution that heteronormative culture cannot be transformed easily by isolated individual acts of will. The converging pathways dramatise the limits of individual resistance in this fictional setting.'),
 shame:cite('556–557','Berlant and Warner examine how failures of idealised intimacy are attributed to individuals rather than the institutions and norms that shape intimate life. Mohini is blamed while the powerful man and community avoid scrutiny.'),
 counter:cite('558, 562','In their discussion of queer counterpublics, Berlant and Warner describe alternative forms of public world-making and collective memory. The recovered archive is our creative attempt to make a suppressed narrative publicly accessible.')};
const data={mohini:{name:'Mohini Pei',region:'Tamil folklore · India',icon:'✿',label:'THE DEADLY ENCHANTRESS',intro:'Seven interactive scenes following Mohini from village life to her transformation into a feared spirit. A fictional feminist reinterpretation, not a definitive folklore origin.',stats:['Reputation','Autonomy','Support'],scenes:[{"stage": "Scene 1", "title": "The King's Attention", "place": "A Village Festival", "time": "Late Afternoon", "film": {"label": "Scene 1 · A Village Festival", "beats": [{"bg": "印度剧情图/01_莫希妮与米娜同行近景.png"}, {"line": "Jasmine is threaded into your hair. Your friend laughs as your silver anklets ring against the stone."}, {"bg": "印度剧情图/02_家人与族人田间劳作.png"}, {"line": "Your family works on land controlled by the royal estate; your caste-marginalised community sustains the village but has little voice in its decisions."}, {"line": "For a moment you are simply Mohini, with a future large enough to imagine."}, {"bg": "印度剧情图/03_王室的邀请_母亲修正版.png"}, {"line": "Then the king's attendant approaches. The ruler wishes to speak with you."}, {"bg": "印度剧情图/03_母亲视角_钱粮与希望.png"}, {"line": "Your mother sees a rare opportunity for a family with few resources;"}, {"bg": "印度剧情图/04_米娜视角_随从与守卫.png"}, {"line": "your friend sees the guards behind him."}, {"bg": "印度剧情图/04_机会与威胁.png"}, {"talk": [{"who": "Mohini", "img": "印度/Mohini_女主_半身.png", "text": "\"Why would he notice someone from our community?\"", "scale": 0.65}, {"who": "Attendant", "text": "\"You should be honoured.\""}]}, {"line": "His voice leaves little room for refusal."}, {"end": "What will you do?", "then": "choice"}]}, "outs": [{"label": "Scene 1 · A Village Festival", "beats": [{"bg": "印度剧情图/05_国王引领进入王宫花园.png", "place": "A Secluded Palace Garden"}, {"line": "You enter the palace garden. He speaks gently, but the attendant notes your name and home. An invitation has quietly become an expectation."}, {"bg": "印度剧情图/08_莲池边的约会.png", "place": "A Secluded Palace Garden"}, {"end": "The palace becomes a recurring presence in Mohini's life.", "then": "next"}]}, {"label": "Scene 1 · A Village Festival", "beats": [{"bg": "印度剧情图/06_女主视角_随从笑容消失.png"}, {"line": "The attendant's smile vanishes. By evening, your mother has heard that you insulted the palace."}, {"bg": "印度剧情图/08_莲池边的约会.png", "place": "A Secluded Palace Garden"}, {"end": "The palace becomes a recurring presence in Mohini's life.", "then": "next"}]}, {"label": "Scene 1 · A Village Festival", "beats": [{"bg": "印度剧情图/07_女主视角_母亲握手.png"}, {"talk": [{"who": "Mother", "img": "印度/Mother_母亲_半身.png", "act": "Your mother squeezes your hand.", "text": "\"A king does not ask twice.\"", "scale": 0.65}]}, {"line": "Her concern is real; so is her fear."}, {"bg": "印度剧情图/08_莲池边的约会.png", "place": "A Secluded Palace Garden"}, {"end": "The palace becomes a recurring presence in Mohini's life.", "then": "next"}]}], "body": ["Jasmine is threaded into your hair. Your friend laughs as your silver anklets ring against the stone.", "Your family works on land controlled by the royal estate; your caste-marginalised community sustains the village but has little voice in its decisions.", "For a moment you are simply Mohini, with a future large enough to imagine.", "Then the king's attendant approaches. The ruler wishes to speak with you.", "Your mother sees a rare opportunity for a family with few resources; your friend sees the guards behind him.", ["Mohini", "\"Why would he notice someone from our community?\""], ["Attendant", "\"You should be honoured.\""], "His voice leaves little room for refusal.", {"cls": "rb-em", "t": "What will you do?"}], "opts": [["Accept the invitation", ["You enter the palace garden. He speaks gently, but the attendant notes your name and home. An invitation has quietly become an expectation."]], ["Decline politely", ["The attendant's smile vanishes. By evening, your mother has heard that you insulted the palace."]], ["Ask your family first", ["Your mother squeezes your hand. \"A king does not ask twice.\" Her concern is real; so is her fear."]]]}, {"stage": "Scene 2", "title": "The Promise", "place": "A Secluded Palace Garden", "time": "Evening", "film": {"label": "Scene 2 · A Secluded Palace Garden", "beats": [{"bg": "印度剧情图/Scene2_01_傍晚莲池独处.png"}, {"stack": ["He remembers the flowers you wear. He asks what kind of life you dream of.", "You speak of learning, travelling, and choosing your own future.", "\"I will marry you,\" he says. \"But not yet. The court must not know.\""]}, {"talk": [{"who": "Mohini", "img": "印度/Mohini_女主_半身.png", "text": "\"Is it my caste that troubles them, or the thought of someone like me standing beside you?\"", "scale": 0.65}]}, {"bg": "印度剧情图/Scene2_02_国王移开目光.png"}, {"talk": [{"who": "King", "img": "印度/King_国王_半身.png", "act": "The king looks away.", "text": "\"What we have does not need their approval.\"", "scale": 0.65}, {"who": "Mohini", "img": "印度/Mohini_女主_半身.png", "text": "\"It is easy to say that, when their disapproval will never cost you your home.\"", "scale": 0.65}]}, {"bg": "印度剧情图/Scene2_03_女主视角看国王.png"}, {"line": "For a moment you want to believe him. Then you realise that only one of you can afford for this promise to remain a secret."}, {"end": "How do you answer?", "then": "choice"}]}, "outs": [{"label": "Scene 2 · Mohini's Family Home", "beats": [{"bg": "印度剧情图/Scene2_04_A枕下五封信.png", "place": "Mohini's Family Home"}, {"line": "You fold his letter beneath your pillow. Weeks pass."}, {"bg": "印度剧情图/Scene2_05_A枕下只剩一封信.png"}, {"line": "His messenger arrives less often."}, {"line": "Your hope becomes something you must hide."}, {"end": "The king's letters become less frequent.", "then": "next"}]}, {"label": "Scene 2 · The Palace", "beats": [{"bg": "印度剧情图/Scene2_06_B宫廷窃窃私语.png", "place": "The Palace"}, {"talk": [{"who": "King", "img": "印度/King_国王_半身.png", "act": "He grows cold.", "text": "\"Do you doubt my word?\"", "scale": 0.65}]}, {"line": "The court begins describing you as demanding."}, {"bg": "印度剧情图/Scene2_05_A枕下只剩一封信.png", "place": "Mohini's Family Home"}, {"end": "The king's letters become less frequent.", "then": "next"}]}, {"label": "Scene 2 · The Village", "beats": [{"bg": "印度剧情图/Scene2_07_C村庄窃窃私语.png", "place": "The Village"}, {"line": "He does not stop you. But the village already knows you entered the palace, and it invents a story for your silence."}, {"bg": "印度剧情图/Scene2_05_A枕下只剩一封信.png", "place": "Mohini's Family Home"}, {"end": "The king's letters become less frequent.", "then": "next"}]}], "body": ["He remembers the flowers you wear. He asks what kind of life you dream of.", "You speak of learning, travelling, and choosing your own future.", "\"I will marry you,\" he says. \"But not yet. The court must not know.\"", ["Mohini", "\"Is it my caste that troubles them, or the thought of someone like me standing beside you?\""], "The king looks away.", ["King", "\"What we have does not need their approval.\""], ["Mohini", "\"It is easy to say that, when their disapproval will never cost you your home.\""], "For a moment you want to believe him. Then you realise that only one of you can afford for this promise to remain a secret.", {"cls": "rb-em", "t": "How do you answer?"}], "opts": [["Believe him and wait", ["You fold his letter beneath your pillow. Weeks pass. His messenger arrives less often. Your hope becomes something you must hide."]], ["Ask him to acknowledge you publicly", ["He grows cold. \"Do you doubt my word?\" The court begins describing you as demanding."]], ["End the relationship", ["He does not stop you. But the village already knows you entered the palace, and it invents a story for your silence."]]]}, {"stage": "Scene 3", "title": "The Village Whispers", "place": "Village Market", "time": "Midday", "film": {"label": "Scene 3 · Village Market", "beats": [{"bg": "印度剧情图/Scene3_01_茉莉花篮与集市流言.png"}, {"line": "At the market, conversations stop when you approach."}, {"line": "A woman who once bought jasmine from you now looks away."}, {"bg": "印度剧情图/Scene3_02_村民的两种揣测.png"}, {"line": "Someone says you pursued the king. Someone else says a woman of your caste should have known her place."}, {"line": "A neighbour mutters that the ruler was generous even to notice you."}, {"bg": "印度剧情图/Scene3_03_广场上的王室旗帜.png"}, {"line": "You look across the square and see his banners carried past, immaculate."}, {"line": "Your name and caste are being discussed. His is being celebrated."}, {"bg": "印度剧情图/主题图_社会等级与权力金字塔.png"}, {"stack": ["\"She should have known her place.\"", "\"Did she really think he would marry her?\"", "\"The king was generous even to notice her.\""], "tone": "whisper"}, {"end": "How will you respond?", "then": "choice"}]}, "outs": [{"label": "Scene 3 · Village Market", "beats": [{"bg": "印度剧情图/Scene3_04_A当面对质.png"}, {"end": "You speak clearly. The crowd asks why you were alone with him in the first place. Your truth is made into another accusation.", "then": "next"}]}, {"label": "Scene 3 · The Village", "beats": [{"bg": "印度剧情图/Scene3_05_B洗衣时听见流言.png", "place": "The Village"}, {"end": "Your father thanks you for not causing trouble. Later you hear a neighbour call your silence a confession.", "then": "next"}]}, {"label": "Scene 3 · The Village", "beats": [{"bg": "印度剧情图/Scene3_06_C树下请求长者.png", "place": "The Village"}, {"end": "The elder says a dispute with the palace would shame the village. He advises you to forget the matter.", "then": "next"}]}], "body": ["At the market, conversations stop when you approach.", "A woman who once bought jasmine from you now looks away.", "Someone says you pursued the king. Someone else says a woman of your caste should have known her place.", "A neighbour mutters that the ruler was generous even to notice you.", "You look across the square and see his banners carried past, immaculate.", "Your name and caste are being discussed. His is being celebrated.", {"cls": "rb-em", "t": "How will you respond?"}], "opts": [["Tell everyone what he promised", ["You speak clearly. The crowd asks why you were alone with him in the first place. Your truth is made into another accusation."]], ["Stay silent to protect your family", ["Your father thanks you for not causing trouble. Later you hear a neighbour call your silence a confession."]], ["Seek an elder's intervention", ["The elder says a dispute with the palace would shame the village. He advises you to forget the matter."]]]}, {"stage": "Scene 4", "title": "The Closed Doors", "place": "Mohini's Family Home", "time": "Night", "film": {"label": "Scene 4 · Mohini's Family Home", "beats": [{"bg": "印度剧情图/Scene4_01_第一人称读最后一封信.png"}, {"line": "The king's final letter arrives."}, {"bg": "印度剧情图/Scene4_02_家人争吵与生计担忧.png"}, {"line": "Your family fears losing work on the royal estate if you challenge him."}, {"bg": "印度剧情图/Scene4_04_母亲低头回避目光.png"}, {"line": "Your mother sits beside you but cannot meet your eyes."}, {"talk": [{"who": "Mother", "img": "印度/Mother_母亲_半身.png", "text": "\"I believe you. But what can we do? If the estate turns us away, where will we go?\"", "scale": 0.65}, {"who": "Mohini", "img": "印度/Mohini_女主_半身.png", "text": "\"I'm not asking you to fight a king. I'm asking you to stand beside me.\"", "scale": 0.65}]}, {"bg": "印度剧情图/Scene4_05_父亲闩上大门.png"}, {"line": "Your father has barred the gate, hoping the gossip will pass."}, {"end": "Who will you turn to?", "then": "choice"}]}, "outs": [{"label": "Scene 4 · Mohini's Family Home", "beats": [{"bg": "印度剧情图/Scene4_06_母亲握手与父亲争辩.png"}, {"line": "Your mother holds your hand. Your father fears the palace. They argue while you wait for a decision about your own life."}, {"bg": "印度剧情图/Scene4_10_雨打屋檐与油灯.png", "place": "Mohini's Family Home", "hold": 2600}, {"bg": "印度剧情图/Scene4_09_黎明前雨中离家.png", "time": "Before Dawn"}, {"end": "Mohini leaves the house before dawn, uncertain whether she can remain in the village.", "then": "next"}]}, {"label": "Scene 4 · The Village", "beats": [{"bg": "印度剧情图/Scene4_07_文书拒绝申诉.png", "place": "The Village"}, {"line": "A clerk refuses to register your complaint. He dismisses a woman from your community before hearing her evidence. The king's word, he says, is not for you to question."}, {"bg": "印度剧情图/Scene4_10_雨打屋檐与油灯.png", "place": "Mohini's Family Home", "hold": 2600}, {"bg": "印度剧情图/Scene4_09_黎明前雨中离家.png", "time": "Before Dawn"}, {"end": "Mohini leaves the house before dawn, uncertain whether she can remain in the village.", "then": "next"}]}, {"label": "Scene 4 · The Village", "beats": [{"bg": "印度剧情图/Scene4_08_米娜拿出积蓄.png", "place": "The Village"}, {"line": "Your friend offers a place to sleep and the money she has saved. It is not enough to undo the harm, but you are no longer alone."}, {"bg": "印度剧情图/Scene4_10_雨打屋檐与油灯.png", "place": "Mohini's Family Home", "hold": 2600}, {"bg": "印度剧情图/Scene4_09_黎明前雨中离家.png", "time": "Before Dawn"}, {"end": "Mohini leaves the house before dawn, uncertain whether she can remain in the village.", "then": "next"}]}], "body": ["The king's final letter arrives.", "Your family fears losing work on the royal estate if you challenge him.", "Your mother sits beside you but cannot meet your eyes.", ["Mother", "\"I believe you. But what can we do? If the estate turns us away, where will we go?\""], ["Mohini", "\"I'm not asking you to fight a king. I'm asking you to stand beside me.\""], "Your father has barred the gate, hoping the gossip will pass.", {"cls": "rb-em", "t": "Who will you turn to?"}], "opts": [["Ask your family to stand beside you", ["Your mother holds your hand. Your father fears the palace. They argue while you wait for a decision about your own life."]], ["Petition the royal court", ["A clerk refuses to register your complaint. He dismisses a woman from your community before hearing her evidence. The king's word, he says, is not for you to question."]], ["Confide in your closest friend", ["Your friend offers a place to sleep and the money she has saved. It is not enough to undo the harm, but you are no longer alone."]]]}, {"stage": "Scene 5", "title": "The Last Jasmine", "place": "A Road Beyond the Village", "time": "Before Dawn", "film": {"label": "Scene 5 · A Road Beyond the Village", "beats": [{"bg": "印度剧情图/Scene5_01_雨中树下的枯茉莉.png"}, {"line": "You walk beneath trees that once sheltered your laughter."}, {"line": "The jasmine in your hair has dried."}, {"bg": "印度剧情图/Scene5_02_背影与远处宫灯.png"}, {"line": "In the distance, the palace lamps still burn."}, {"line": "You could go back and ask for mercy. You could leave without money, connections or a place to stay. You could ask the village to hear you one final time."}, {"line": "You are tired of begging to be believed."}, {"line": "But you are not tired of wanting to live."}, {"end": "What do you choose?", "then": "choice"}]}, "outs": [{"label": "Scene 5 · The Palace", "beats": [{"bg": "印度剧情图/Scene5_03_天明前紧闭的宫门.png", "place": "The Palace"}, {"end": "The gates do not open. You wait until morning, holding a promise that the palace has already forgotten.", "then": "next", "black": true}]}, {"label": "Scene 5 · A Road Beyond the Village", "beats": [{"bg": "印度剧情图/Scene5_05_枯花与空荡道路.png"}, {"end": "You take the road into darkness. No one knows where you went. Rumour fills the silence long before anyone tries to find you.", "then": "next", "black": true}]}, {"label": "Scene 5 · Village Market", "beats": [{"bg": "印度剧情图/Scene5_04_有人倾听有人离开.png", "place": "Village Market", "time": "Midday"}, {"end": "A few neighbours listen. Others turn away.", "then": "next", "black": true}]}], "body": ["You walk beneath trees that once sheltered your laughter.", "The jasmine in your hair has dried.", "In the distance, the palace lamps still burn.", "You could go back and ask for mercy. You could leave without money, connections or a place to stay. You could ask the village to hear you one final time.", "You are tired of begging to be believed.", "But you are not tired of wanting to live.", {"cls": "rb-em", "t": "What do you choose?"}], "opts": [["Go to the palace one final time", ["The gates do not open. You wait until morning, holding a promise that the palace has already forgotten."]], ["Leave the village", ["You take the road into darkness. No one knows where you went. Rumour fills the silence long before anyone tries to find you."]], ["Ask the village to hear your account", ["A few neighbours listen. Others turn away."]]]}],final:{"stage": "Final Scene", "title": "The Woman Becomes the Ghost", "film": {"label": "Final Scene", "beats": [{"bg": "印度剧情图/Ending_01_树下流传的两种结局.png"}, {"line": "Days later, Mohini is missing."}, {"line": "Some say she died beyond the village. Others say she wandered away and never returned."}, {"line": "The story never tells us which account is true."}, {"bg": "印度剧情图/Ending_02_传说中的茉莉幽灵_正面恐怖版_v2.png"}, {"line": "Years pass."}, {"line": "People speak of a beautiful spirit in jasmine and anklets who waits for men after sunset."}, {"line": "They call her dangerous."}, {"line": "They do not speak of the king's promise, the closed gates, or the friend who searched for her."}, {"line": "You played a life with desires and relationships."}, {"line": "The village remembers only a warning, not the caste hierarchy, dependence on estate work, or unequal power that shaped her choices."}, {"end": "\"He returned to his palace. I became a story told to frighten strangers.\"", "then": "next"}]}, "body": ["Days later, Mohini is missing.", "Some say she died beyond the village. Others say she wandered away and never returned.", "The story never tells us which account is true.", "Years pass.", "People speak of a beautiful spirit in jasmine and anklets who waits for men after sunset.", "They call her dangerous.", "They do not speak of the king's promise, the closed gates, or the friend who searched for her.", "You played a life with desires and relationships.", "The village remembers only a warning, not the caste hierarchy, dependence on estate work, or unequal power that shaped her choices.", {"cls": "rb-em", "t": "\"He returned to his palace. I became a story told to frighten strangers.\""}]}},
red:{name:'The Red Bride',region:'Chinese-inspired ghost-marriage fiction',icon:'囍',label:'THE RED-DRESSED GHOST',intro:'Adapted from the supplied “The Red Bridal Dress” storyline. This is fiction inspired by historical traditions; it does not imply that Chinese ghost marriages generally involved killing living brides.',stats:['Family Approval','Autonomy','Support'],scenes:[
{title:'Whispers Behind the Wall',place:'The Li Courtyard',time:'Afternoon',film:{"label": "Prologue · The Li Courtyard", "beats": [{"bg": "午后井边洗衣_v1.png"}, {"line": "Afternoon sunlight falls across the courtyard. You crouch beside the well, scrubbing clothes that have faded with washing."}, {"line": "The water in the wooden basin has long since turned murky, and the icy well water has left your fingertips red."}, {"line": "Your parents’ hushed voices drift from inside the house. Your mother seems to be crying."}, {"talk": [{"who": "Mother", "img": "红嫁衣角色立绘/母亲_半身.png", "text": "“She is still so young… How can we do this?”"}, {"who": "Father", "img": "红嫁衣角色立绘/父亲_半身.png", "text": "“Then what do you suggest? How many more days will our grain last? They are willing to give us so much. They already think more highly of us than we deserve.”"}]}, {"end": "The house suddenly falls silent. Your hands stop moving.", "then": "choice"}]},outs:[{"label": "Prologue · The Li Courtyard", "beats": [{"bg": "午后井边洗衣_v1.png"}, {"end": "You lower your head and keep washing, but find that you cannot concentrate at all. The sound of your mother’s crying will not leave you.", "then": "next"}]}, {"label": "Prologue · The Li Courtyard", "beats": [{"bg": "第一章场景/02_门边偷听_v1.png"}, {"line": "You step softly toward the door."}, {"talk": [{"who": "Father", "img": "红嫁衣角色立绘/父亲_半身.png", "text": "“The marriage has already been arranged. They will come for her in a few days.”"}, {"who": "Mother", "img": "红嫁衣角色立绘/母亲_半身.png", "text": "“Is there really no other way?”"}]}, {"line": "Suddenly, a man calls from outside the courtyard:"}, {"talk": [{"who": "A Man", "img": "红嫁衣角色立绘/角色立绘/运粮男人_半身.png", "text": "“Old Li! Come out! The grain from the Chen family is here!”", "scale": 0.68}]}, {"bg": "第一章场景/03_父亲推门撞见女主_v1.png"}, {"line": "The conversation inside stops abruptly. Your father pushes open the door and sees you standing in the courtyard. His expression shifts slightly."}, {"talk": [{"who": "Father", "img": "红嫁衣角色立绘/角色立绘/父亲_生气_半身.png", "text": "“What are you standing there for? Go and help!”"}]}, {"end": "", "then": "next"}]}],body:['The house suddenly falls silent. Your hands stop moving.'],opts:[['Keep working without asking questions.',['You lower your head and keep washing, but find that you cannot concentrate at all. The sound of your mother’s crying will not leave you.']],['Quietly approach the door and listen to what they are saying.',['You step softly toward the door and hear your father say, “The marriage has already been arranged. They will come for her in a few days.” Your mother asks, “Is there really no other way?”','Suddenly, a man calls from outside the courtyard: “Old Li! Come out! The grain from the Chen family is here!”','The conversation inside stops abruptly. Your father pushes open the door and sees you standing in the courtyard. His expression shifts slightly. “What are you standing there for? Go and help!”']]]},
{"title": "Unexpected Betrothal Gifts", "place": "The Courtyard Gate", "time": "Afternoon", "body": ["Outside the courtyard gate stands a flatbed cart piled with grain. You have not seen so much grain in a very long time. Your father carefully inspects the sacks, a smile appearing on his face for the first time in ages.", ["Father", "“Everything will be all right now… None of us will have to go hungry anymore.”"], "But you remember the argument inside the house."], "opts": [["Ask your father, “Why do we suddenly have so much grain?”", ["Your father smiles and pats a sack. “I have found you a good match. They are major landowners in town. All of this is their betrothal gift.”", ["You", "“But I do not even know who he is.”"], ["Father", "“Marriage has always been for parents to decide. This family has raised you all these years. Now it is time for you to show your filial devotion to the family. All you need to do is wait for your wedding without worrying.”"], "You look at the sacks. “Father, why is this grain my betrothal gift? Is this grain all my marriage is worth?”", "Your father frowns. “Do you think marriage is just two people living together? Once you marry, it concerns both families. The Chens gain a daughter-in-law, and our family gains a way to survive. What is wrong with that?”", ["You", "“But…”"], "(Interrupting immediately)", ["Father", "“You will understand when you have a family of your own.”"]]], ["Stop asking questions and take your mother some water.", ["Your mother sits on the edge of the bed, clutching a handkerchief. You hand her the water. “Mother, what has happened to our family?”", ["Mother", "“I have failed you. I could not give you a good life. But… this is a good home for you to marry into.”"], ["You", "“What home?”"], ["Mother", "“Your father has found you a match. The Chens are major landowners in town. All the grain delivered today is their betrothal gift.”"], ["You", "“But Mother, I still do not know what kind of person he is.”"], ["Mother", "“Marriage is not just about two people. The Chens are willing to help us through this hardship. That is already an enormous kindness.”"], ["You", "“And what about what I think?”"], "Your mother does not answer. She simply turns away."]]], "then": ["Whichever path you choose, you learn one thing: your parents have already decided your marriage for you. You feel uneasy, yet cannot help thinking that if the family truly is wealthy, perhaps your life really will improve. At least your family will no longer have to go hungry. You can also understand your mother’s predicament: although she does not want this, she cannot overrule your father’s decision. For the first time, you realize that in this family, your father has the power to decide, while mother and daughter rarely have the chance to say “no.” But as you look at the sacks of grain in the courtyard, something suddenly strikes you as strange: you are the one getting married, yet all anyone talks about is what the two families stand to gain."], "basis": {"title": "Marriage and Economic Structures (p. 553)", "quote": "“social reproduction, the accumulation and transfer of capital”", "text": "Berlant & Warner (1998) connect institutionalized forms of normative intimacy with social reproduction and the accumulation and transfer of capital. In the game, the grain given as a betrothal gift symbolizes the incorporation of the protagonist’s marriage into her family’s economic arrangements."}, "film": {"label": "Scene 1 · The Courtyard Gate", "beats": [{"bg": "第一章场景/04_院门外粮车与父女_v1.png"}, {"line": "Outside the courtyard gate stands a flatbed cart piled with grain. You have not seen so much grain in a very long time. Your father carefully inspects the sacks, a smile appearing on his face for the first time in ages."}, {"talk": [{"who": "Father", "img": "红嫁衣角色立绘/角色立绘/父亲_扛粮微笑_半身.png", "text": "“Everything will be all right now… None of us will have to go hungry anymore.”", "scale": 0.75}]}, {"end": "But you remember the argument inside the house.", "then": "choice"}]}, "outs": [{"label": "Scene 1 · The Courtyard Gate", "beats": [{"bg": "第一章场景/04_院门外粮车与父女_v1.png"}, {"line": "Your father smiles and pats a sack."}, {"talk": [{"who": "Father", "img": "红嫁衣角色立绘/角色立绘/父亲_扛粮微笑_半身.png", "text": "“I have found you a good match. They are major landowners in town. All of this is their betrothal gift.”", "scale": 0.75}, {"who": "You", "img": "红嫁衣角色立绘/主角_半身.png", "text": "“But I do not even know who he is.”", "scale": 0.75}, {"who": "Father", "img": "红嫁衣角色立绘/角色立绘/父亲_扛粮微笑_半身.png", "text": "“Marriage has always been for parents to decide. This family has raised you all these years. Now it is time for you to show your filial devotion to the family. All you need to do is wait for your wedding without worrying.”", "scale": 0.75}, {"who": "You", "img": "红嫁衣角色立绘/主角_半身.png", "text": "“Father, why is this grain my betrothal gift? Is this grain all my marriage is worth?”", "scale": 0.75, "act": "You look at the sacks."}, {"who": "Father", "img": "红嫁衣角色立绘/角色立绘/父亲_生气_半身.png", "text": "“Do you think marriage is just two people living together? Once you marry, it concerns both families. The Chens gain a daughter-in-law, and our family gains a way to survive. What is wrong with that?”", "scale": 0.75, "act": "Your father frowns."}, {"who": "You", "img": "红嫁衣角色立绘/主角_半身.png", "text": "“But…”", "scale": 0.75}, {"who": "Father", "img": "红嫁衣角色立绘/角色立绘/父亲_生气_半身.png", "text": "“You will understand when you have a family of your own.”", "scale": 0.75, "act": "(Interrupting immediately)"}]}, {"line": "Whichever path you choose, you learn one thing: your parents have already decided your marriage for you."}, {"line": "You feel uneasy, yet cannot help thinking that if the family truly is wealthy, perhaps your life really will improve. At least your family will no longer have to go hungry."}, {"line": "You can also understand your mother’s predicament: although she does not want this, she cannot overrule your father’s decision."}, {"line": "For the first time, you realize that in this family, your father has the power to decide, while mother and daughter rarely have the chance to say “no.”"}, {"end": "But as you look at the sacks of grain in the courtyard, something suddenly strikes you as strange: you are the one getting married, yet all anyone talks about is what the two families stand to gain.", "then": "next"}]}, {"label": "Scene 1 · Inside the House", "beats": [{"bg": "第一章场景/05_母女床边递水_v1.png", "place": "Inside the House"}, {"line": "Your mother sits on the edge of the bed, clutching a handkerchief. You hand her the water."}, {"talk": [{"who": "You", "img": "红嫁衣角色立绘/主角_半身.png", "text": "“Mother, what has happened to our family?”", "scale": 0.75}, {"who": "Mother", "img": "红嫁衣角色立绘/母亲_半身.png", "text": "“I have failed you. I could not give you a good life. But… this is a good home for you to marry into.”", "scale": 0.75}, {"who": "You", "img": "红嫁衣角色立绘/主角_半身.png", "text": "“What home?”", "scale": 0.75}, {"who": "Mother", "img": "红嫁衣角色立绘/母亲_半身.png", "text": "“Your father has found you a match. The Chens are major landowners in town. All the grain delivered today is their betrothal gift.”", "scale": 0.75}, {"who": "You", "img": "红嫁衣角色立绘/主角_半身.png", "text": "“But Mother, I still do not know what kind of person he is.”", "scale": 0.75}, {"who": "Mother", "img": "红嫁衣角色立绘/母亲_半身.png", "text": "“Marriage is not just about two people. The Chens are willing to help us through this hardship. That is already an enormous kindness.”", "scale": 0.75}, {"who": "You", "img": "红嫁衣角色立绘/主角_半身.png", "text": "“And what about what I think?”", "scale": 0.75}]}, {"line": "Your mother does not answer. She simply turns away."}, {"line": "Whichever path you choose, you learn one thing: your parents have already decided your marriage for you."}, {"line": "You feel uneasy, yet cannot help thinking that if the family truly is wealthy, perhaps your life really will improve. At least your family will no longer have to go hungry."}, {"line": "You can also understand your mother’s predicament: although she does not want this, she cannot overrule your father’s decision."}, {"line": "For the first time, you realize that in this family, your father has the power to decide, while mother and daughter rarely have the chance to say “no.”"}, {"end": "But as you look at the sacks of grain in the courtyard, something suddenly strikes you as strange: you are the one getting married, yet all anyone talks about is what the two families stand to gain.", "then": "next"}]}]},{"title": "Rumors at the Village Entrance", "place": "The Village Entrance", "time": "The Next Day", "body": ["The next day, you decide to go out and see whether you can help your father move the remaining grain. As soon as you reach the village entrance, you notice people watching you. Neighbors who are usually warm and friendly suddenly fall silent today.", ["Old Woman", "“Poor child…”"], ["Neighbor", "“Watch what you say! It will be trouble if the Chens hear you.”"], ["Villager A", "“I heard the Chens’ only son died a few days ago.”"], ["Villager B", "“Yes, so young… Master Chen cannot bear to let his son leave this world alone.”"], ["Villager A", "“Young Master Chen never even married. How could Master Chen be at peace?”"], ["Villager B", "“Exactly. Everyone should marry and establish a family in their lifetime. He was the Chens’ only son. How could they let him go all alone?”"], ["Villager A", "“I hear the Li family has already agreed. Now both families can be at peace.”"], "You stop in your tracks. The Chens? Was that not the name of the wealthy family your father mentioned? Suddenly, you understand: the man you are to marry may already be dead.", "Why does everyone in the village pity the young man who died? Should they not pity me? Why do I not even have the power to decide my own marriage?"], "opts": [["Go home and demand the truth from your parents.", ["You rush home. “Father! Is the Chen family’s son already dead?”", ["Father", "“Where did you hear that?”"], ["You", "“So it is true?”"], ["Father", "“Sooner or later, you will have to marry. Once you marry into their family, they will treat you well. And our whole family will be able to survive.”"], ["You", "“But he is already dead!”"], "Your father slams his hand on the table. “What does it matter if he is dead? You are this family’s daughter. Should you not help ease your parents’ burdens? You will still be the daughter-in-law of a landowning family!”", "Your mother stands by the door without a word."]], ["Flee the village immediately.", ["You turn and run toward the edge of the village. But you have lived here since childhood and have never gone to town alone. When you reach a fork in the road, you do not know which way to go. There are only a few copper coins in your pocket. The sky grows dark, and the mountain path becomes hard to make out. A horse-drawn carriage passes, and you ask the driver to take you away.", ["Driver", "“Miss, a ride to town is not free. Do you have money for the journey?”"], "You lower your head. Before night falls, you have no choice but to follow the familiar path back to the village."]]], "then": ["You lie awake all night. You have finally confirmed that you are about to marry someone who has already died. Yet you still believe that if you can find someone willing to help, there must be a way."], "basis": {"title": "Heteronormativity (p. 548)", "quote": "“projected as an ideal or moral accomplishment”", "text": "The authors argue that heterosexuality and its associated arrangements may be presented as an ideal or a moral accomplishment. The villagers’ dialogue about the expectation that even the dead should marry is a creative, cross-cultural application of the logic that normalizes marriage."}, "film": {"label": "Scene 2 · The Village Entrance", "beats": [{"bg": "第一章场景/06_村口流言_女主与村民_v1.png"}, {"line": "The next day, you decide to go out and see whether you can help your father move the remaining grain. As soon as you reach the village entrance, you notice people watching you. Neighbors who are usually warm and friendly suddenly fall silent today."}, {"talk": [{"who": "Old Woman", "img": "红嫁衣角色立绘/角色立绘/老妇人_半身.png", "text": "“Poor child…”", "scale": 0.75}, {"who": "Neighbor", "img": "红嫁衣角色立绘/角色立绘/邻人_半身.png", "text": "“Watch what you say! It will be trouble if the Chens hear you.”", "scale": 0.75}, {"who": "Villager A", "img": "红嫁衣角色立绘/角色立绘/村民甲_半身.png", "text": "“I heard the Chens’ only son died a few days ago.”", "scale": 0.75}, {"who": "Villager B", "img": "红嫁衣角色立绘/角色立绘/村民乙_半身.png", "text": "“Yes, so young… Master Chen cannot bear to let his son leave this world alone.”", "scale": 0.75}, {"who": "Villager A", "img": "红嫁衣角色立绘/角色立绘/村民甲_半身.png", "text": "“Young Master Chen never even married. How could Master Chen be at peace?”", "scale": 0.75}, {"who": "Villager B", "img": "红嫁衣角色立绘/角色立绘/村民乙_半身.png", "text": "“Exactly. Everyone should marry and establish a family in their lifetime. He was the Chens’ only son. How could they let him go all alone?”", "scale": 0.75}, {"who": "Villager A", "img": "红嫁衣角色立绘/角色立绘/村民甲_半身.png", "text": "“I hear the Li family has already agreed. Now both families can be at peace.”", "scale": 0.75}]}, {"line": "You stop in your tracks. The Chens? Was that not the name of the wealthy family your father mentioned? Suddenly, you understand: the man you are to marry may already be dead."}, {"end": "Why does everyone in the village pity the young man who died? Should they not pity me? Why do I not even have the power to decide my own marriage?", "then": "choice"}]}, "outs": [{"label": "Scene 2 · The Li Family Kitchen", "beats": [{"bg": "第一章场景/07A_回家质问父母_v1.png", "place": "The Li Family Kitchen"}, {"talk": [{"who": "You", "img": "红嫁衣角色立绘/主角_半身.png", "text": "“Father! Is the Chen family’s son already dead?”", "scale": 0.75, "act": "You rush home."}, {"who": "Father", "img": "红嫁衣角色立绘/父亲_半身.png", "text": "“Where did you hear that?”", "scale": 0.75}, {"who": "You", "img": "红嫁衣角色立绘/主角_半身.png", "text": "“So it is true?”", "scale": 0.75}, {"who": "Father", "img": "红嫁衣角色立绘/父亲_半身.png", "text": "“Sooner or later, you will have to marry. Once you marry into their family, they will treat you well. And our whole family will be able to survive.”", "scale": 0.75}, {"who": "You", "img": "红嫁衣角色立绘/主角_半身.png", "text": "“But he is already dead!”", "scale": 0.75}]}, {"bg": "第一章场景/07B_父亲起身拍桌争吵_v1.png", "place": "The Li Family Kitchen"}, {"talk": [{"who": "Father", "img": "红嫁衣角色立绘/角色立绘/父亲_生气_半身.png", "text": "“What does it matter if he is dead? You are this family’s daughter. Should you not help ease your parents’ burdens? You will still be the daughter-in-law of a landowning family!”", "scale": 0.75, "act": "Your father slams his hand on the table."}]}, {"line": "Your mother stands by the door without a word."}, {"end": "You lie awake all night. You have finally confirmed that you are about to marry someone who has already died. Yet you still believe that if you can find someone willing to help, there must be a way.", "then": "next", "time": "That Night"}]}, {"label": "Scene 2 · The Village Edge", "beats": [{"bg": "第一章场景/08B_逃离村口_v1.png", "place": "The Village Edge"}, {"line": "You turn and run toward the edge of the village. But you have lived here since childhood and have never gone to town alone."}, {"bg": "第一章场景/09B_山路岔口_背影_v1.png", "place": "A Fork in the Road"}, {"line": "When you reach a fork in the road, you do not know which way to go. There are only a few copper coins in your pocket. The sky grows dark, and the mountain path becomes hard to make out."}, {"bg": "第一章场景/10B_黄昏岔路遇马车_v1.png", "place": "A Fork in the Road", "time": "Dusk"}, {"line": "A horse-drawn carriage passes, and you ask the driver to take you away."}, {"talk": [{"who": "Driver", "img": "红嫁衣角色立绘/角色立绘/车夫_半身.png", "text": "“Miss, a ride to town is not free. Do you have money for the journey?”", "scale": 0.75}]}, {"line": "You lower your head."}, {"bg": "第一章场景/11B_夜晚沮丧返村_v1.png", "place": "The Village", "time": "Nightfall"}, {"line": "Before night falls, you have no choice but to follow the familiar path back to the village."}, {"bg": "第一章场景/12_窗边彻夜未眠_v1.png", "place": "Your Bedroom", "time": "That Night"}, {"end": "You lie awake all night. You have finally confirmed that you are about to marry someone who has already died. Yet you still believe that if you can find someone willing to help, there must be a way.", "then": "next"}]}]},{"title": "No Helping Hand", "place": "The Village", "time": "Three Days Before the Wedding", "body": ["There are three days left before the wedding. You know it will be difficult to leave the village on your own. But you refuse to simply accept your fate. You decide to seek help."], "opts": [["Ask your childhood friend for help.", ["You knock on the door of your friend A-Yue’s home and tell her what has happened.", "A-Yue takes your hands. “You cannot marry into that family! I will help you.” She takes out a jade pendant. “My mother left this to me. Take it and exchange it for money for your journey.”", "The door is suddenly pushed open. A-Yue’s father snatches the pendant away. “How dare you meddle in the Chen family’s affairs? This is another family’s marriage! Do you want our whole family to offend the Chens?”", "A-Yue looks at you, her eyes red. “I am sorry…”"]], ["Ask the village head to intervene and cancel the marriage arrangement.", ["You go to the village head’s home and kneel at him, begging for help.", ["You", "“Village Head, I do not want to marry a dead man. This is my marriage. Why can I not decide for myself?”"], "The village head sets down his teacup. “Young woman, you are being too simple-minded. Marriage has never been just about two people. Your parents have already accepted the betrothal gifts, and the Chens have informed their clan. To go back on the agreement now would damage both families’ reputations.”", ["You", "“But I am the one marrying into that family, not them!”"], ["Village Head", "“Precisely because you are the one marrying into it, you have all the more reason to protect both families’ dignity.”"], ["You", "“Do I not even have the right to decide my own marriage?”"], "The village head avoids your eyes. “Go home. Do not make this any uglier.”"]]], "then": ["You walk home alone. Your friend is willing to help, and the village head has power, but both fear the pressure arising from class differences. You once thought that if your parents agreed to cancel the marriage, everything would be over. But the Chens’ wealth makes others afraid to offend them, your father’s decisions are treated as the rules of the household, and “filial piety” is used to demand that you accept it all. It seems that everyone has a say in this marriage except you."], "basis": {"title": "Publicly Mediated Intimacy (p. 553)", "quote": "“intimacy is itself publicly mediated”", "text": "The protagonist’s marriage is shaped not only by private wishes, but also by the combined intervention of her family, clan members, the village head, and concerns about family reputation."}, "film": {"label": "Scene 3 · The Li Courtyard", "beats": [{"bg": "午后井边洗衣_v1.png", "place": "The Li Courtyard"}, {"end": "There are three days left before the wedding. You know it will be difficult to leave the village on your own. But you refuse to simply accept your fate. You decide to seek help.", "then": "choice"}]}, "outs": [{"label": "Scene 3 · A-Yue’s Home", "beats": [{"bg": "第一章场景/13A_向阿月求助_交谈_v1.png", "place": "A-Yue’s Home"}, {"line": "You knock on the door of your friend A-Yue’s home and tell her what has happened."}, {"talk": [{"who": "A-Yue", "img": "红嫁衣角色立绘/角色立绘/阿月_半身.png", "act": "A-Yue takes your hands.", "text": "“You cannot marry into that family! I will help you.”", "scale": 0.65}]}, {"bg": "第一章场景/14A_阿月握手赠玉_v1.png"}, {"talk": [{"who": "A-Yue", "img": "红嫁衣角色立绘/角色立绘/阿月_半身.png", "act": "She takes out a jade pendant.", "text": "“My mother left this to me. Take it and exchange it for money for your journey.”", "scale": 0.65}]}, {"bg": "第一章场景/15A_阿月父亲夺玉_v1.png"}, {"talk": [{"who": "A-Yue’s father", "img": "红嫁衣角色立绘/角色立绘/阿月父亲_半身.png", "act": "The door is suddenly pushed open. A-Yue’s father snatches the pendant away.", "text": "“How dare you meddle in the Chen family’s affairs? This is another family’s marriage! Do you want our whole family to offend the Chens?”", "scale": 0.65}]}, {"bg": "第一章场景/16A_阿月含泪道歉_v1.png"}, {"talk": [{"who": "A-Yue", "img": "红嫁衣角色立绘/角色立绘/阿月_半身.png", "act": "A-Yue looks at you, her eyes red.", "text": "“I am sorry…”", "scale": 0.65}]}, {"bg": "第一章场景/11B_夜晚沮丧返村_v1.png", "place": "The Village"}, {"end": "You walk home alone. Your friend is willing to help, and the village head has power, but both fear the pressure arising from class differences. You once thought that if your parents agreed to cancel the marriage, everything would be over. But the Chens’ wealth makes others afraid to offend them, your father’s decisions are treated as the rules of the household, and “filial piety” is used to demand that you accept it all. It seems that everyone has a say in this marriage except you.", "then": "next"}]}, {"label": "Scene 3 · The Village Head’s Home", "beats": [{"bg": "第一章场景/13B_跪求村长_执笔饮茶_v2.png", "place": "The Village Head’s Home"}, {"line": "You go to the village head’s home and kneel at him, begging for help."}, {"talk": [{"who": "You", "img": "红嫁衣角色立绘/主角_半身.png", "text": "“Village Head, I do not want to marry a dead man. This is my marriage. Why can I not decide for myself?”", "scale": 0.75}]}, {"bg": "第一章场景/14B_村长放杯_女主绝望_v2.png"}, {"talk": [{"who": "Village Head", "img": "红嫁衣角色立绘/角色立绘/村长_半身.png", "act": "The village head sets down his teacup.", "text": "“Young woman, you are being too simple-minded. Marriage has never been just about two people. Your parents have already accepted the betrothal gifts, and the Chens have informed their clan. To go back on the agreement now would damage both families’ reputations.”", "scale": 0.75}, {"who": "You", "img": "红嫁衣角色立绘/主角_半身.png", "text": "“But I am the one marrying into that family, not them!”", "scale": 0.75}, {"who": "Village Head", "img": "红嫁衣角色立绘/角色立绘/村长_半身.png", "text": "“Precisely because you are the one marrying into it, you have all the more reason to protect both families’ dignity.”", "scale": 0.75}, {"who": "You", "img": "红嫁衣角色立绘/主角_半身.png", "text": "“Do I not even have the right to decide my own marriage?”", "scale": 0.75}, {"who": "Village Head", "img": "红嫁衣角色立绘/角色立绘/村长_半身.png", "act": "The village head avoids your eyes.", "text": "“Go home. Do not make this any uglier.”", "scale": 0.75}]}, {"bg": "第一章场景/11B_夜晚沮丧返村_v1.png", "place": "The Village"}, {"end": "You walk home alone. Your friend is willing to help, and the village head has power, but both fear the pressure arising from class differences. You once thought that if your parents agreed to cancel the marriage, everything would be over. But the Chens’ wealth makes others afraid to offend them, your father’s decisions are treated as the rules of the household, and “filial piety” is used to demand that you accept it all. It seems that everyone has a say in this marriage except you.", "then": "next"}]}]},{"title": "The Red Bridal Dress", "place": "Your Bedroom", "time": "The Day Before the Wedding", "film": {"label": "Scene 4 · Your Bedroom", "beats": [{"bg": "第一章场景/17_婚前嫁衣_女主进门_v1.png", "place": "Your Bedroom"}, {"line": "The day before the wedding. You push open your bedroom door and find a red bridal dress, a gold hairpin, earrings, and embroidered shoes neatly laid out on the bed. Your mother stands beside it, gently stroking the patterns on the dress."}, {"bg": "第一章场景/18_婚前嫁衣_母女并坐_v1.png"}, {"talk": [{"who": "Mother", "img": "红嫁衣角色立绘/母亲_半身.png", "text": "“The Chens sent these. They are all fine things.”"}, {"who": "You", "img": "红嫁衣角色立绘/主角_半身.png", "text": "“Mother, are you really going to make me marry into their family?”"}, {"who": "Mother", "img": "红嫁衣角色立绘/母亲_半身.png", "text": "“Your father has already accepted the betrothal gifts. We… have no choice now.”"}, {"who": "You", "img": "红嫁衣角色立绘/主角_半身.png", "text": "“What about me? What will happen to me?”"}, {"who": "Mother", "img": "红嫁衣角色立绘/母亲_半身.png", "text": "“As long as you dutifully behave as the Chens’ daughter-in-law, no one will make things difficult for you.”"}, {"who": "You", "img": "红嫁衣角色立绘/主角_半身.png", "text": "“Mother, when you married Father, did someone else decide for you too?”"}, {"who": "Mother", "img": "红嫁衣角色立绘/母亲_半身.png", "act": "Your mother falls silent.", "text": "“In those days, how could a girl choose her own husband?”"}, {"who": "You", "img": "红嫁衣角色立绘/主角_半身.png", "text": "“But Mother, have you been happy?”"}, {"who": "Mother", "img": "红嫁衣角色立绘/母亲_半身.png", "act": "Your mother lowers her head and straightens the dress.", "text": "“How can a woman expect everything in her life to go as she wishes? As a daughter, you must consider your parents; once married, you must consider your husband’s family. I had no choice back then either.”"}, {"who": "You", "img": "红嫁衣角色立绘/主角_半身.png", "text": "“But I do not even know what kind of person he is.”"}, {"who": "Mother", "img": "红嫁衣角色立绘/母亲_半身.png", "text": "“I know this is unfair to you. But from childhood, our elders taught us to honor our parents and never bring shame upon the family. I once wanted to resist too, but in the end I followed my family’s arrangements.”"}]}, {"bg": "第一章场景/19_婚前嫁衣_女主视角看母亲_v1.png"}, {"end": "You look at your mother, suddenly at a loss for words. She knows perfectly well that you do not want this, yet still hopes you will accept the marriage. You realize that she is both constrained by power within the family and unconsciously passing the same expectations on to you. Does something become right and unquestionable simply because it has existed long enough?", "then": "choice"}]}, "body": ["The day before the wedding. You push open your bedroom door and find a red bridal dress, a gold hairpin, earrings, and embroidered shoes neatly laid out on the bed. Your mother stands beside it, gently stroking the patterns on the dress.", ["Mother", "“The Chens sent these. They are all fine things.”"], ["You", "“Mother, are you really going to make me marry into their family?”"], ["Mother", "“Your father has already accepted the betrothal gifts. We… have no choice now.”"], ["You", "“What about me? What will happen to me?”"], ["Mother", "“As long as you dutifully behave as the Chens’ daughter-in-law, no one will make things difficult for you.”"], ["You", "“Mother, when you married Father, did someone else decide for you too?”"], "Your mother falls silent. “In those days, how could a girl choose her own husband?”", ["You", "“But Mother, have you been happy?”"], "Your mother lowers her head and straightens the dress. “How can a woman expect everything in her life to go as she wishes? As a daughter, you must consider your parents; once married, you must consider your husband’s family. I had no choice back then either.”", ["You", "“But I do not even know what kind of person he is.”"], ["Mother", "“I know this is unfair to you. But from childhood, our elders taught us to honor our parents and never bring shame upon the family. I once wanted to resist too, but in the end I followed my family’s arrangements.”"], "You look at your mother, suddenly at a loss for words. She knows perfectly well that you do not want this, yet still hopes you will accept the marriage. You realize that she is both constrained by power within the family and unconsciously passing the same expectations on to you. Does something become right and unquestionable simply because it has existed long enough?"], "opts": [["Pretend to obey and wait for one last chance to escape.", ["You lower your head. “I understand, Mother. I will get ready for the wedding.”", "Your mother lets out a relieved breath. You sit before the bronze mirror and watch her comb your hair. The person in the mirror wears a red bridal dress, her face unfamiliar. You silently take note of the courtyard gate’s position, thinking that perhaps tomorrow there will still be a chance to escape."]], ["Threaten to end your life unless your parents cancel the marriage arrangement.", ["You stand before your parents. “If you insist on making me marry into that family, I would rather die here.”", "Your mother begins to cry in fright. Your father’s face darkens. “Are you trying to drive our entire family to our deaths? We have already accepted the Chens’ betrothal gifts. How can we simply call off the marriage?”", ["You", "“Then why will you not ask whether I want it?”"], "Your father calls in family members, has you locked in your room, and posts someone at the door. “She is not to leave until tomorrow’s wedding is over.”", "You pound on the door until you have no strength left."]]], "outs": [{"label": "Scene 4 · Your Bedroom", "beats": [{"bg": "第一章场景/19_婚前嫁衣_女主视角看母亲_v1.png"}, {"talk": [{"who": "You", "img": "红嫁衣角色立绘/主角_半身.png", "act": "You lower your head.", "text": "“I understand, Mother. I will get ready for the wedding.”"}]}, {"line": "Your mother lets out a relieved breath."}, {"bg": "第一章场景/20A_铜镜前母亲梳头.png"}, {"line": "You sit before the bronze mirror and watch her comb your hair. The person in the mirror wears a red bridal dress, her face unfamiliar. You silently take note of the courtyard gate’s position, thinking that perhaps tomorrow there will still be a chance to escape."}, {"time": "The Wedding Day", "end": "Early the next morning. Whatever you did last night, the door is opened. Several women enter to prepare your hair and makeup. One puts the gold hairpin in place; another adjusts your red bridal dress. You hear wedding music from beyond the courtyard. The wedding has begun.", "then": "next"}]}, {"label": "Scene 4 · The Li Family Kitchen", "beats": [{"bg": "第一章场景/20B_婚前与父母争吵.png", "place": "The Li Family Kitchen"}, {"talk": [{"who": "You", "img": "红嫁衣角色立绘/主角_半身.png", "act": "You stand before your parents.", "text": "“If you insist on making me marry into that family, I would rather die here.”", "scale": 0.65}, {"who": "Father", "img": "红嫁衣角色立绘/角色立绘/父亲_生气_半身.png", "act": "Your mother begins to cry in fright. Your father’s face darkens.", "text": "“Are you trying to drive our entire family to our deaths? We have already accepted the Chens’ betrothal gifts. How can we simply call off the marriage?”", "scale": 0.65}, {"who": "You", "img": "红嫁衣角色立绘/主角_半身.png", "text": "“Then why will you not ask whether I want it?”", "scale": 0.65}]}, {"bg": "第一章场景/21B_被锁屋内_弟弟守门.png", "place": "The Li Courtyard"}, {"line": "Your father calls in family members, has you locked in your room, and posts someone at the door."}, {"talk": [{"who": "Father", "img": "红嫁衣角色立绘/角色立绘/父亲_生气_半身.png", "text": "“She is not to leave until tomorrow’s wedding is over.”", "scale": 0.65}]}, {"line": "You pound on the door until you have no strength left."}, {"bg": "第一章场景/22_婚礼清晨_妇人梳妆.png", "place": "Your Bedroom"}, {"time": "The Wedding Day", "end": "Early the next morning. Whatever you did last night, the door is opened. Several women enter to prepare your hair and makeup. One puts the gold hairpin in place; another adjusts your red bridal dress. You hear wedding music from beyond the courtyard. The wedding has begun.", "then": "next"}]}], "then": ["Early the next morning. Whatever you did last night, the door is opened. Several women enter to prepare your hair and makeup. One puts the gold hairpin in place; another adjusts your red bridal dress. You hear wedding music from beyond the courtyard. The wedding has begun."], "basis": {"title": "Normalization (p. 554)", "quote": "“a tacit sense of rightness and normalcy”", "text": "Although the mother feels for her daughter, she regards obedience to marriage arrangements as a normal part of life, showing how norms are perpetuated through everyday life and experience passed down across generations."}},{"title": "The Bride in the Sedan Chair", "place": "The Bridal Sedan Chair", "time": "The Wedding Day", "film": {"label": "Scene 5 · The Bridal Sedan Chair", "beats": [{"bg": "第一章场景/23_花轿离村.png"}, {"line": "The red bridal sedan chair slowly leaves the village."}, {"bg": "第一章场景/24_唢呐队近景.png"}, {"line": "The sound of suona horns echoes through the streets."}, {"bg": "第一章场景/25_路旁村民近景.png"}, {"line": "Villagers lining the roadside. Some smile; others sigh. Suddenly, it all seems absurd: this is supposed to be a wedding, so why does everyone look as though they are saying farewell?"}, {"bg": "第一章场景/26_父亲争吵_女主视角.png"}, {"line": "You remember your father’s words: “Once you marry into their family, all of us will have a good life.”"}, {"bg": "第一章场景/19_婚前嫁衣_女主视角看母亲_v1.png"}, {"line": "Then your mother’s: “As long as you know your place, no one will make things difficult for you.”"}, {"bg": "第一章场景/27_轿内低头看嫁衣.png"}, {"end": "You look down at your red bridal dress. Perhaps marrying a dead man is not as frightening as you imagined. At least he will not argue with you or hurt you. Perhaps, if you can endure a few years, you will be able to start your life anew.", "then": "choice"}]}, "body": ["The red bridal sedan chair slowly leaves the village. The sound of suona horns echoes through the streets. Villagers lining the roadside. Some smile; others sigh. Suddenly, it all seems absurd: this is supposed to be a wedding, so why does everyone look as though they are saying farewell?", "You remember your father’s words: “Once you marry into their family, all of us will have a good life.” Then your mother’s: “As long as you know your place, no one will make things difficult for you.”", "You look down at your red bridal dress. Perhaps marrying a dead man is not as frightening as you imagined. At least he will not argue with you or hurt you. Perhaps, if you can endure a few years, you will be able to start your life anew."], "opts": [["Accept your fate for now and look for a way out after the wedding.", ["You take a deep breath. “As long as I am alive, there will always be a way.”", "The bridal sedan chair continues forward and stops at the Chen family’s gate."]], ["Refuse to go through with the wedding, making death your final act of resistance.", ["You know the bridal sedan chair is drawing closer to the Chen household. Unwilling to let others decide your life any longer, you finally make an irreversible decision.", "When the sedan chair stops, those waiting outside receive no answer. The wedding music gradually falls silent.", "You have not completed the wedding. But the story is not over."]]], "outs": [{"label": "Scene 5 · The Bridal Sedan Chair", "beats": [{"bg": "第一章场景/28_女主坐在花轿内.png"}, {"talk": [{"who": "You", "img": "红嫁衣角色立绘/女主_嫁衣定稿_半身.png", "act": "You take a deep breath.", "text": "“As long as I am alive, there will always be a way.”", "scale": 0.75}]}, {"bg": "第一章场景/29_花轿停在陈家门前.png"}, {"end": "The bridal sedan chair continues forward and stops at the Chen family’s gate.", "then": "next"}]}, {"label": "Scene 5 · The Bridal Sedan Chair", "beats": [{"bg": "第一章场景/27_轿内低头看嫁衣.png"}, {"line": "You know the bridal sedan chair is drawing closer to the Chen household."}, {"bg": "第一章场景/31B_揭开盖头凝视金钗.png"}, {"line": "Unwilling to let others decide your life any longer, you finally make an irreversible decision."}, {"bg": "第一章场景/32B_金钗落在嫁衣上_象征镜头.png"}, {"line": "When the sedan chair stops, those waiting outside receive no answer."}, {"bg": "第一章场景/30_陈家门口近景.png"}, {"end": "The wedding music gradually falls silent. You have not completed the wedding. But the story is not over.", "then": "next"}]}]},{"title": "The Last Cup of Tea", "place": "The Chen Ancestral Hall", "time": "The Wedding Day", "film": {"label": "Scene 6 · The Chen Ancestral Hall", "beats": [{"bg": "第一章场景/33_祠堂前下轿.png"}, {"line": "The bridal sedan chair stops before the Chen family’s ancestral hall. You step out and find none of the bustle and joy of an ordinary wedding in the courtyard. Red lanterns hang beneath the eaves."}, {"bg": "第一章场景/34_祠堂灵位与陈家夫妇.png"}, {"line": "A spirit tablet stands in the center of the ancestral hall, with two red candles burning before it. Master and Madam Chen sit in the seats of honor."}, {"talk": [{"who": "Old Woman", "img": "红嫁衣角色立绘/祠堂老妇人_半身.png", "text": "“Bride, first serve tea to your parents-in-law.”", "scale": 0.65}]}, {"line": "You take the teacup, puzzled: why is everyone standing here? Why has no one mentioned what will happen after the wedding?"}, {"bg": "第一章场景/35_跪地敬茶.png"}, {"line": "You kneel and offer the tea."}, {"bg": "第一章场景/41_敬茶时陈夫人打量女主.png"}, {"talk": [{"who": "Madam Chen", "img": "红嫁衣角色立绘/陈夫人_半身.png", "act": "Madam Chen looks at you carefully.", "text": "“She has a pleasing face, at least.”", "scale": 0.65}, {"who": "Master Chen", "img": "红嫁衣角色立绘/陈老爷_半身.png", "text": "“It is almost time. Do not miss the auspicious hour.”", "scale": 0.65}]}, {"bg": "第一章场景/35_跪地敬茶.png"}, {"talk": [{"who": "You", "img": "红嫁衣角色立绘/女主_嫁衣定稿_半身.png", "text": "“Master, Madam, where will I live once the ceremony is over?”", "scale": 0.65}, {"who": "Madam Chen", "img": "红嫁衣角色立绘/陈夫人_半身.png", "text": "“With my son, of course.”", "scale": 0.65}, {"who": "You", "img": "红嫁衣角色立绘/女主_嫁衣定稿_半身.png", "text": "“But… has the young master not already passed away?”", "scale": 0.65}]}, {"bg": "第一章场景/38_侧门打开看见棺木.png"}, {"talk": [{"who": "Old Woman", "img": "红嫁衣角色立绘/祠堂老妇人_半身.png", "act": "The ancestral hall suddenly falls silent. The old woman steps behind you.", "text": "“Young woman, do you still not know? Today’s wedding is to unite you with the young master forever.”", "scale": 0.65}]}, {"line": "The side door of the ancestral hall slowly opens. Several people are waiting outside. You see a coffin."}, {"line": "Only now do you finally understand—they never intended for you to leave this wedding alive."}, {"bg": "第一章场景/40_陈老爷冷硬回应.png"}, {"talk": [{"who": "You", "img": "红嫁衣角色立绘/女主_嫁衣定稿_半身.png", "act": "You turn to Master and Madam Chen.", "text": "“I have never even met your son! There is no love between us as husband and wife. Why must I become his wife?”", "scale": 0.65}]}, {"bg": "第一章场景/42_女主被两名女仆抓住.png"}, {"talk": [{"who": "Master Chen", "img": "红嫁衣角色立绘/陈老爷_半身.png", "text": "“How can the status of husband and wife depend on whether there is affection? Our two families have agreed to the marriage, and our clan members have witnessed it. You are the daughter-in-law of the Chen family.”", "scale": 0.65}, {"who": "You", "img": "红嫁衣角色立绘/女主_嫁衣定稿_半身.png", "text": "“But he is already dead! What meaning can such a marriage have?”", "scale": 0.65}, {"who": "Master Chen", "img": "红嫁衣角色立绘/陈老爷_半身.png", "text": "“Husband and wife in life, husband and wife in death. This marriage cannot be called off simply because you do not want it.”", "scale": 0.65}]}, {"bg": "第一章场景/女主被喂药.png"}, {"end": "You finally understand: they have never cared whether you loved this man or whether you wanted to become his wife. As long as the marriage is recognized by the families, you must assume the identity it assigns you. Even if the price is your life.", "then": "choice"}]}, "body": ["The bridal sedan chair stops before the Chen family’s ancestral hall. You step out and find none of the bustle and joy of an ordinary wedding in the courtyard. Red lanterns hang beneath the eaves. A spirit tablet stands in the center of the ancestral hall, with two red candles burning before it. Master and Madam Chen sit in the seats of honor.", ["Old Woman", "“Bride, first serve tea to your parents-in-law.”"], "You take the teacup, puzzled: why is everyone standing here? Why has no one mentioned what will happen after the wedding?", "You kneel and offer the tea. Madam Chen looks at you carefully. “She has a pleasing face, at least.”", ["Master Chen", "“It is almost time. Do not miss the auspicious hour.”"], ["You", "“Master, Madam, where will I live once the ceremony is over?”"], ["Madam Chen", "“With my son, of course.”"], ["You", "“But… has the young master not already passed away?”"], "The ancestral hall suddenly falls silent. The old woman steps behind you. “Young woman, do you still not know? Today’s wedding is to unite you with the young master forever.”", "The side door of the ancestral hall slowly opens. Several people are waiting outside. You see a coffin.", "Only now do you finally understand—they never intended for you to leave this wedding alive.", "You turn to Master and Madam Chen.", ["You", "“I have never even met your son! There is no love between us as husband and wife. Why must I become his wife?”"], ["Master Chen", "“How can the status of husband and wife depend on whether there is affection? Our two families have agreed to the marriage, and our clan members have witnessed it. You are the daughter-in-law of the Chen family.”"], ["You", "“But he is already dead! What meaning can such a marriage have?”"], ["Master Chen", "“Husband and wife in life, husband and wife in death. This marriage cannot be called off simply because you do not want it.”"], "You finally understand: they have never cared whether you loved this man or whether you wanted to become his wife. As long as the marriage is recognized by the families, you must assume the identity it assigns you. Even if the price is your life."], "opts": [["Lose all hope and stop resisting.", ["You have pleaded with your parents, asked your friend for help, and appealed to the village head, yet no one has been able to change this wedding.", "You say nothing more. As they lead you toward the coffin, you simply gaze at the distant sky. This is the last time you will see daylight."]], ["Knock over the teacup and resist the ritual with all your strength.", ["“No! I will not!” The teacup shatters on the floor. You turn and rush toward the entrance to the ancestral hall. Master Chen shouts angrily, “Stop her!”", "Several people block your way. You struggle with all your strength, but cannot get through that doorway. At last, the doors of the ancestral hall close behind you. Your resistance has failed to stop the ritual."]]], "outs": [{"label": "Scene 6 · The Chen Ancestral Hall", "beats": [{"bg": "第一章场景/女主披上红盖头.png"}, {"line": "You have pleaded with your parents, asked your friend for help, and appealed to the village head, yet no one has been able to change this wedding."}, {"bg": "第一章场景/女主被放进棺材.png"}, {"line": "You say nothing more."}, {"line": "As they lead you toward the coffin, you simply gaze at the distant sky."}, {"bg": "第一章场景/47B_额间点朱砂.png", "hold": 2600}, {"bg": "第一章场景/活女主和男主在棺材里.png", "hold": 2600}, {"bg": "第一章场景/合上棺材.png"}, {"end": "This is the last time you will see daylight.", "then": "next", "black": true}]}, {"label": "Scene 6 · The Chen Ancestral Hall", "beats": [{"bg": "第一章场景/49B_茶杯摔碎.png"}, {"talk": [{"who": "You", "img": "红嫁衣角色立绘/女主_嫁衣定稿_半身.png", "text": "“No! I will not!”", "scale": 0.65}]}, {"line": "The teacup shatters on the floor. You turn and rush toward the entrance to the ancestral hall."}, {"talk": [{"who": "Master Chen", "img": "红嫁衣角色立绘/陈老爷_半身.png", "act": "Master Chen shouts angrily,", "text": "“Stop her!”", "scale": 0.65}]}, {"line": "Several people block your way."}, {"bg": "第一章场景/50B_祠堂大门紧闭.png"}, {"line": "You struggle with all your strength, but cannot get through that doorway. At last, the doors of the ancestral hall close behind you."}, {"bg": "第一章场景/51B_女主挣扎后被制住.png"}, {"end": "Your resistance has failed to stop the ritual.", "then": "next"}]}], "basis": {"title": "Institutional Support of Marriage (p. 562)", "quote": "“marriage and family law”", "text": "The authors discuss how normative forms of intimacy are supported by institutional and material arrangements. Through a family marriage agreement, ritual, and recognition by clan members, the game shows how the identity of wife may still be imposed in the absence of an actual intimate relationship. This does not provide grounds for claiming that ghost marriage is recognized under modern marriage law."}}],endings:{"A": {"stage": "Ending A", "title": "The Last Refusal", "place":
